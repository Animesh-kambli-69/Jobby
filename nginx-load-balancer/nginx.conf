# ==============================================================================
# Nginx Load Balancer for AWS EC2 Backend Cluster (Jobby / JobGraph)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    # --------------------------------------------------------------------------
    # Basic Settings & MIME types
    # --------------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # --------------------------------------------------------------------------
    # CRITICAL: Allow large uploads for Resumes and Video Interview Recordings
    # Backend allows up to 200MB for video recordings
    # --------------------------------------------------------------------------
    client_max_body_size 200M;

    # --------------------------------------------------------------------------
    # Upstream Backend EC2 Cluster
    # Replace the placeholder IPs with your EC2 instances' Private or Public IPs
    # (Use Private IPs if your load balancer is in the same AWS VPC)
    # --------------------------------------------------------------------------
    upstream backend_cluster {
        # least_conn routes to the server with fewest active connections.
        # This is ideal for AI parsing and video uploads which take variable time.
        least_conn;

        # EC2 Backend Instance 1
        server EC2_BACKEND_1_IP:5000 max_fails=3 fail_timeout=10s;

        # EC2 Backend Instance 2
        server EC2_BACKEND_2_IP:5000 max_fails=3 fail_timeout=10s;

        # Keepalive persistent connections to backends to reduce TCP handshake overhead
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # HTTP Server (Port 80)
    # --------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Load balancer local health check (useful for AWS Route53 or Target Group checks)
        location /lb-health {
            access_log off;
            return 200 '{"status":"ok","lb":"active"}';
            add_header Content-Type application/json;
        }

        # ----------------------------------------------------------------------
        # Reverse Proxy to EC2 Backend Cluster
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://backend_cluster;

            # HTTP 1.1 + clearing Connection header enables upstream keepalive
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Forward original client headers to the backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (for Socket.io live updates if used)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeout configurations for AI operations (Groq resume parsing / mock interviews)
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Buffer settings for streaming file uploads and API responses
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }

    # --------------------------------------------------------------------------
    # HTTPS Server (SSL/TLS Template - Uncomment when domain & certs are ready)
    # --------------------------------------------------------------------------
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    #
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #
    #     client_max_body_size 200M;
    #
    #     location / {
    #         proxy_pass http://backend_cluster;
    #         proxy_http_version 1.1;
    #         proxy_set_header Connection "";
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto https;
    #         proxy_read_timeout 60s;
    #     }
    # }
}
