# ==============================================================================
# Jobby Hybrid Nginx Load Balancer (Hosted on Render)
# Proxies traffic across:
#   - Backend 1: AWS EC2 Instance (${EC2_BACKEND_PROTOCOL}://${EC2_BACKEND_HOST}:${EC2_BACKEND_PORT})
#   - Backend 2: Render Service   (${RENDER_BACKEND_PROTOCOL}://${RENDER_BACKEND_HOST}:${RENDER_BACKEND_PORT})
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # --------------------------------------------------------------------------
    # Logging: Force access and error logs to stdout/stderr for Render log stream
    # --------------------------------------------------------------------------
    log_format lb_log '[$time_local] [LB] $remote_addr - "$request" $status | Upstream: $upstream_addr | Time: ${upstream_response_time}s';
    access_log /dev/stdout lb_log;
    error_log  /dev/stderr notice;

    # --------------------------------------------------------------------------
    # WebSocket connection upgrade mapping
    # --------------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # --------------------------------------------------------------------------
    # Forwarded Proto mapping: Preserve client HTTPS from Render edge router
    # --------------------------------------------------------------------------
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # --------------------------------------------------------------------------
    # Real IP fallback mapping for internal forwarders
    # --------------------------------------------------------------------------
    map $http_x_real_ip $client_real_ip {
        default $http_x_real_ip;
        ''      $remote_addr;
    }

    # --------------------------------------------------------------------------
    # CRITICAL: Allow up to 200MB uploads for resumes and interview recordings
    # --------------------------------------------------------------------------
    client_max_body_size 200M;

    # --------------------------------------------------------------------------
    # Upstream Cluster: Load balance across EC2 and Render forwarders
    # --------------------------------------------------------------------------
    upstream backend_cluster {
        # least_conn distributes requests to the server with fewest active connections.
        # Ideal for variable AI parsing jobs and video uploads.
        least_conn;

        # Internal loopback forwarder to AWS EC2 Backend
        server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;

        # Internal loopback forwarder to Render Backend
        server 127.0.0.1:8082 max_fails=3 fail_timeout=10s;

        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # Main Server: Render assigns $PORT dynamically for Web Services
    # --------------------------------------------------------------------------
    server {
        listen ${PORT};
        server_name _;
        client_max_body_size 200M;

        # ----------------------------------------------------------------------
        # Load Balancer Health Checks
        # ----------------------------------------------------------------------
        # General LB status (used by Render health check)
        location /lb-health {
            access_log off;
            return 200 '{"status":"ok","lb":"active","platform":"render","targets":["ec2","render"]}';
            add_header Content-Type application/json;
        }

        # Targeted health probe for EC2 backend
        location /lb-health/ec2 {
            access_log off;
            proxy_pass http://127.0.0.1:8081/api/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        # Targeted health probe for Render backend
        location /lb-health/render {
            access_log off;
            proxy_pass http://127.0.0.1:8082/api/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        # ----------------------------------------------------------------------
        # Reverse Proxy to Hybrid Backend Cluster
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://backend_cluster;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Forward original client headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;

            # Automatic failover: if one backend fails or times out, retry next
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;

            # Timeouts for long AI / Groq LLM parsing and mock interviews
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Streaming uploads / video uploads without buffering delay
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }

    # --------------------------------------------------------------------------
    # Internal Forwarder 1: AWS EC2 Backend
    # Handles protocol adaptation (HTTP/HTTPS) and port forwarding to EC2
    # --------------------------------------------------------------------------
    server {
        listen 127.0.0.1:8081;
        access_log off;
        client_max_body_size 200M;

        location / {
            proxy_pass ${EC2_BACKEND_PROTOCOL}://${EC2_BACKEND_HOST}:${EC2_BACKEND_PORT};

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # EC2 host header
            proxy_set_header Host ${EC2_BACKEND_HOST};
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            # TLS SNI support if EC2 backend uses HTTPS
            proxy_ssl_server_name on;
            proxy_ssl_name ${EC2_BACKEND_HOST};

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            proxy_buffering off;
            proxy_request_buffering off;
        }
    }

    # --------------------------------------------------------------------------
    # Internal Forwarder 2: Render Backend
    # Handles Render edge routing (requires Host header matching service name),
    # SSL SNI for *.onrender.com, and protocol adaptation
    # --------------------------------------------------------------------------
    server {
        listen 127.0.0.1:8082;
        access_log off;
        client_max_body_size 200M;

        location / {
            proxy_pass ${RENDER_BACKEND_PROTOCOL}://${RENDER_BACKEND_HOST}:${RENDER_BACKEND_PORT};

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # CRITICAL: Render Cloudflare/Edge routing routes by Host header
            proxy_set_header Host ${RENDER_BACKEND_HOST};
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            # TLS SNI support for Render HTTPS endpoints
            proxy_ssl_server_name on;
            proxy_ssl_name ${RENDER_BACKEND_HOST};

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
